<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes chaînes YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f5;
    --panel: #ffffff;
    --ink: #14213d;
    --muted: #5b6678;
    --line: #d9dfe8;
    --accent: #3a35d6;
    --up: #137a4b;
    --down: #b3261e;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1424; --panel: #171e35; --ink: #e8ecf8; --muted: #9aa5bf; --line: #2a3354; --accent: #8c89ff; --up: #4cc38a; --down: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--body); }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 20px 64px; }
  header { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: end; margin-bottom: 28px; }
  h1 { margin: 0; font: 700 clamp(1.8rem, 4vw, 2.6rem)/1.1 var(--display); letter-spacing: -0.02em; }
  #updated { margin: 6px 0 0; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--panel); }
  .seg button { font: 500 0.9rem var(--body); color: var(--muted); background: none; border: 0; padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .seg button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .channel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; margin-bottom: 20px; }
  .who { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .who img { width: 48px; height: 48px; border-radius: 50%; background: var(--line); }
  .who a { font: 700 1.25rem var(--display); color: inherit; text-decoration: none; }
  .who a:hover { text-decoration: underline; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
  .label { color: var(--muted); font-size: 0.9rem; }
  .value { font: 700 clamp(2rem, 5vw, 2.8rem)/1.1 var(--display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .delta { font-size: 0.9rem; color: var(--muted); min-height: 1.4em; }
  .delta .pos { color: var(--up); font-weight: 500; }
  .delta .neg { color: var(--down); font-weight: 500; }
  svg { display: block; width: 100%; height: 64px; color: var(--accent); margin-top: 8px; }
  .hint { color: var(--muted); font-size: 0.85rem; margin: 8px 0 0; }
  .empty { background: var(--panel); border: 1px dashed var(--line); border-radius: 14px; padding: 28px; }
  .empty strong { font-family: var(--display); font-size: 1.2rem; }

  /* Graphique vues / vidéos */
  :root { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --grid: #e6eaf0; }
  @media (prefers-color-scheme: dark) {
    :root { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --grid: #232b48; }
  }
  .curve h2 { margin: 0; font: 700 1.25rem var(--display); }
  .curve .sub { margin: 2px 0 14px; color: var(--muted); font-size: 0.9rem; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 10px; padding: 0; list-style: none; }
  .legend button { display: inline-flex; align-items: center; gap: 7px; font: 400 0.88rem var(--body); color: var(--ink); background: none; border: 0; padding: 4px 2px; cursor: pointer; }
  .legend button[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
  .legend button[aria-pressed="false"] .sw { opacity: 0.3; }
  .legend .sw { width: 14px; height: 3px; border-radius: 2px; }
  .plot { position: relative; }
  .plot svg { height: auto; color: inherit; margin: 0; overflow: visible; }
  .plot .tick { fill: var(--muted); font: 400 12px var(--body); font-variant-numeric: tabular-nums; }
  .plot .axis-title { fill: var(--muted); font: 500 12px var(--body); }
  .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 0.85rem; line-height: 1.4; box-shadow: 0 4px 14px rgb(0 0 0 / 0.12); white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); }
  .tip b { font-weight: 500; }
  .tip .m { color: var(--muted); }
  .curve details { margin-top: 12px; font-size: 0.9rem; }
  .curve summary { cursor: pointer; color: var(--muted); }
  .curve table { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .curve th, .curve td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .curve th:first-child, .curve td:first-child { text-align: left; }
  .curve th { color: var(--muted); font-weight: 500; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Mes chaînes YouTube</h1>
      <p id="updated">Chargement…</p>
    </div>
    <div class="seg" role="group" aria-label="Période affichée">
      <button data-range="7" aria-pressed="false">7 jours</button>
      <button data-range="30" aria-pressed="true">30 jours</button>
      <button data-range="90" aria-pressed="false">90 jours</button>
    </div>
  </header>
  <section class="channel curve" id="curve" hidden>
    <h2>Vues de chaque vidéo, de la première à la dernière</h2>
    <p class="sub">Une courbe par chaîne, de la première vidéo publiée à la dernière. Survole un point pour voir la vidéo.</p>
    <ul class="legend" id="curve-legend"></ul>
    <div class="plot" id="curve-plot"></div>
    <details>
      <summary>Voir les chiffres</summary>
      <table id="curve-table"></table>
    </details>
  </section>
  <main id="channels" aria-live="polite"></main>
</div>

<script>
const nf = new Intl.NumberFormat("fr-FR");
const root = document.getElementById("channels");
let history = { channels: {} };
let range = 30;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const day = (iso) => new Date(iso + "T12:00:00");

function sparkline(values) {
  if (values.length < 2) return '<p class="hint">La courbe apparaît dès le deuxième jour de données.</p>';
  const w = 300, h = 64, min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
  const d = values.map((v, i) => {
    const x = (i / (values.length - 1)) * w;
    const y = h - 4 - ((v - min) / span) * (h - 8);
    return (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
  }).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Évolution sur la période"><path d="${d}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

function stat(label, rows, key) {
  const pts = rows.filter((r) => r[key] != null);
  if (!pts.length) return `<div><div class="label">${label}</div><div class="value">Masqué</div></div>`;
  const last = pts[pts.length - 1], first = pts[0];
  let delta = '<span>Pas encore de comparaison</span>';
  if (pts.length > 1) {
    const diff = last[key] - first[key];
    const days = Math.round((day(last.date) - day(first.date)) / 864e5);
    const cls = diff > 0 ? "pos" : diff < 0 ? "neg" : "";
    const txt = diff === 0 ? "Stable" : (diff > 0 ? "+" : "−") + nf.format(Math.abs(diff));
    delta = `<span class="${cls}">${txt}</span> sur ${days} j`;
  }
  return `<div><div class="label">${label}</div><div class="value">${nf.format(last[key])}</div><div class="delta">${delta}</div>${sparkline(pts.map((r) => r[key]))}</div>`;
}

// ---------- Graphique vues / vidéos ----------
const compact = new Intl.NumberFormat("fr-FR", { notation: "compact", maximumFractionDigits: 1 });
const hiddenSeries = new Set();

function niceDomain(min, max, count, integer) {
  if (min === max) { const pad = Math.max(Math.abs(min) * 0.1, 1); min -= pad; max += pad; }
  min = Math.max(0, min);
  const raw = (max - min) / count, p = 10 ** Math.floor(Math.log10(raw));
  let step = [1, 2, 2.5, 5, 10].map((m) => m * p).find((s) => s >= raw);
  if (integer) step = Math.max(1, Math.ceil(step));
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(+v.toFixed(6));
  return { lo, hi, ticks };
}

let videoData = { channels: {} };

function renderCurve() {
  const box = document.getElementById("curve");
  const entries = Object.entries(videoData.channels).filter(([, ch]) => ch.videos && ch.videos.length);
  box.hidden = !entries.length;
  if (!entries.length) return;
  // Une couleur fixe par chaîne, dans l'ordre de l'historique
  const order = Object.keys(history.channels);
  // Filtre de période : vidéos publiées dans les N derniers jours (par rapport à la date des données)
  const ref = videoData.date ? day(videoData.date) : new Date();
  const since = ref - range * 864e5;
  const series = entries.map(([id, ch]) => {
    const idx = order.includes(id) ? order.indexOf(id) : order.length + entries.findIndex(([i]) => i === id);
    return {
      id, title: ch.title, color: `var(--s${(idx % 7) + 1})`,
      pts: ch.videos.map((v, k) => ({ x: k + 1, y: v.views, v })).filter((p) => new Date(p.v.published) >= since),
    };
  });

  // Légende (cliquable pour masquer / afficher une chaîne)
  const legend = document.getElementById("curve-legend");
  legend.innerHTML = series.map((s) => `<li><button data-id="${esc(s.id)}" aria-pressed="${!hiddenSeries.has(s.id)}"><span class="sw" style="background:${s.color}"></span>${esc(s.title)}</button></li>`).join("");
  legend.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    hiddenSeries.has(b.dataset.id) ? hiddenSeries.delete(b.dataset.id) : hiddenSeries.add(b.dataset.id);
    renderCurve();
  }));

  // Tableau récapitulatif
  document.getElementById("curve-table").innerHTML = "<thead><tr><th>Chaîne</th><th>Vidéos</th><th>Vues</th><th>Vues / vidéo</th></tr></thead><tbody>" +
    series.filter((s) => s.pts.length).map((s) => { const n = s.pts.length, tot = s.pts.reduce((a, p) => a + p.y, 0); return `<tr><td>${esc(s.title)}</td><td>${nf.format(n)}</td><td>${nf.format(tot)}</td><td>${nf.format(Math.round(tot / n))}</td></tr>`; }).join("") + "</tbody>";

  const plot = document.getElementById("curve-plot");
  const visible = series.filter((s) => !hiddenSeries.has(s.id));
  if (!visible.length) { plot.innerHTML = '<p class="hint">Sélectionne au moins une chaîne dans la légende.</p>'; return; }
  const shown = visible.filter((s) => s.pts.length);
  if (!shown.length) { plot.innerHTML = `<p class="hint">Aucune vidéo publiée sur les ${range} derniers jours.</p>`; return; }

  const X = niceDomain(Math.min(...shown.map((s) => s.pts[0].x)), Math.max(...shown.map((s) => s.pts[s.pts.length - 1].x)), 6, true);
  const Y = niceDomain(0, Math.max(...shown.flatMap((s) => s.pts.map((p) => p.y))), 5, true);
  const W = Math.max(300, plot.clientWidth), H = Math.round(Math.min(380, Math.max(240, W * 0.5)));
  const m = { t: 10, r: 12, b: 42, l: 72 };
  const sx = (v) => m.l + ((v - X.lo) / (X.hi - X.lo)) * (W - m.l - m.r);
  const sy = (v) => H - m.b - ((v - Y.lo) / (Y.hi - Y.lo)) * (H - m.t - m.b);
  const xTicks = X.ticks.filter((_, i) => W > 500 || i % 2 === 0);

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Vues de chaque vidéo, de la première à la dernière publiée, par chaîne">`;
  svg += Y.ticks.map((t) => `<line x1="${m.l}" x2="${W - m.r}" y1="${sy(t)}" y2="${sy(t)}" stroke="var(--grid)" stroke-width="1"/><text class="tick" x="${m.l - 8}" y="${sy(t)}" text-anchor="end" dominant-baseline="middle">${compact.format(t)}</text>`).join("");
  svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="var(--line)"/>`;
  svg += xTicks.map((t) => `<text class="tick" x="${sx(t)}" y="${H - m.b + 18}" text-anchor="middle">${nf.format(t)}</text>`).join("");
  svg += `<text class="axis-title" x="${(m.l + W - m.r) / 2}" y="${H - 4}" text-anchor="middle">Vidéo n° (ordre de publication)</text>`;
  svg += `<text class="axis-title" x="${-(m.t + H - m.b) / 2}" y="12" transform="rotate(-90)" text-anchor="middle">Vues de la vidéo</text>`;
  for (const s of shown) {
    const d = s.pts.map((p, i) => (i ? "L" : "M") + sx(p.x).toFixed(1) + " " + sy(p.y).toFixed(1)).join(" ");
    svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last = s.pts[s.pts.length - 1];
    svg += `<circle cx="${sx(last.x)}" cy="${sy(last.y)}" r="4" fill="${s.color}" stroke="var(--panel)" stroke-width="2"/>`;
  }
  svg += `<circle id="curve-hl" r="5" fill="none" stroke="var(--ink)" stroke-width="2" visibility="hidden"/></svg>`;
  plot.innerHTML = svg + '<div class="tip" id="curve-tip" hidden></div>';

  const el = plot.querySelector("svg"), tip = plot.querySelector("#curve-tip"), hl = plot.querySelector("#curve-hl");
  const targets = shown.flatMap((s) => s.pts.map((p) => ({ s, p, cx: sx(p.x), cy: sy(p.y) })));
  const hide = () => { tip.hidden = true; hl.setAttribute("visibility", "hidden"); };
  el.addEventListener("pointermove", (e) => {
    const r = el.getBoundingClientRect(), k = W / r.width;
    const mx = (e.clientX - r.left) * k, my = (e.clientY - r.top) * k;
    let best = null, bd = 28 * k;
    for (const t of targets) { const d = Math.hypot(t.cx - mx, t.cy - my); if (d < bd) { bd = d; best = t; } }
    if (!best) return hide();
    hl.setAttribute("cx", best.cx); hl.setAttribute("cy", best.cy); hl.setAttribute("visibility", "visible");
    const v = best.p.v, title = v.title.length > 48 ? v.title.slice(0, 47) + "…" : v.title;
    tip.innerHTML = `<b>${esc(best.s.title)}</b> · vidéo n°${nf.format(best.p.x)}<br>${esc(title)}<br>${nf.format(v.views)} vues<br><span class="m">publiée le ${new Date(v.published).toLocaleDateString("fr-FR", { dateStyle: "medium" })}</span>`;
    tip.style.left = Math.min(Math.max(best.cx / k, 130), r.width - 130) + "px";
    tip.style.top = best.cy / k + "px";
    tip.hidden = false;
  });
  el.addEventListener("pointerleave", hide);
}

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderCurve, 150);
});

function render() {
  const entries = Object.entries(history.channels);
  renderCurve();
  if (!entries.length) {
    root.innerHTML = '<div class="empty"><strong>Aucune donnée pour l’instant</strong><p>Lance le workflow « Mise à jour des stats YouTube » dans l’onglet Actions de GitHub : les chiffres apparaîtront ici ensuite, puis chaque matin à 9h.</p></div>';
    document.getElementById("updated").textContent = "En attente de la première mise à jour";
    return;
  }
  let latest = "";
  root.innerHTML = entries.map(([id, ch]) => {
    const all = ch.history;
    const lastDate = all[all.length - 1].date;
    if (lastDate > latest) latest = lastDate;
    const since = new Date(day(lastDate) - range * 864e5);
    const rows = all.filter((r) => day(r.date) >= since);
    return `<section class="channel">
      <div class="who"><img src="${esc(ch.thumb)}" alt="" width="48" height="48"><a href="https://www.youtube.com/channel/${esc(id)}" target="_blank" rel="noopener">${esc(ch.title)}</a></div>
      <div class="stats">${stat("Abonnés", rows, "subs")}${stat("Vues totales", rows, "views")}${stat("Vidéos publiées", rows, "videos")}</div>
    </section>`;
  }).join("");
  document.getElementById("updated").textContent = "Dernière mise à jour : " + day(latest).toLocaleDateString("fr-FR", { dateStyle: "full" });
}

document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
  range = +b.dataset.range;
  document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  render();
}));

fetch("data/history.json", { cache: "no-store" })
  .then((r) => r.json())
  .then((j) => {
    history = j; render();
    fetch("data/videos.json", { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : { channels: {} }))
      .then((v) => { videoData = v; renderCurve(); })
      .catch(() => {});
  })
  .catch(() => {
    document.getElementById("updated").textContent = "Impossible de charger les données.";
    root.innerHTML = '<div class="empty"><strong>Données introuvables</strong><p>Ouvre la page depuis son adresse GitHub Pages (pas en double-cliquant sur le fichier), et vérifie que <code>data/history.json</code> existe.</p></div>';
  });
</script>
</body>
</html>
