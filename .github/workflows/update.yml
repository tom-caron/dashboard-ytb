name: Mise à jour des stats YouTube

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC = 9h à Paris en hiver (10h en été : passe à "0 7" au changement d'heure)
  workflow_dispatch:       # lancement manuel depuis l'onglet Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer les stats
        run: python fetch_stats.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Sauvegarder l'historique
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --staged --quiet || (git commit -m "Stats YouTube du $(date -u +%F)" && git push)

      - name: Préparer le site
        run: mkdir _site && cp -r index.html data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
