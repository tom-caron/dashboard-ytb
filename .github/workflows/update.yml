name: Mise à jour des stats YouTube

on:
  schedule:
    - cron: "7 * * * *"   # toutes les heures (à hh:07) pour suivre l'évolution des vues de chaque vidéo
  workflow_dispatch:       # lancement manuel depuis l'onglet Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # toujours la dernière version, même quand on relance un ancien run

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer les stats
        run: python fetch_stats.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Sauvegarder l'historique
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/videos.json data/video_history.json
          git diff --staged --quiet || (git commit -m "Stats YouTube du $(date -u +%F)" && (git push || (git pull --rebase origin main && git push)))

      - name: Préparer le site
        run: mkdir _site && cp -r index.html data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub met parfois quelques secondes à rendre l'artefact visible :
      # 1er essai toléré en échec, puis on attend et on retente.
      - id: deploy_try
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Attendre avant de retenter
        if: steps.deploy_try.outcome == 'failure'
        run: sleep 30

      - id: deploy_retry
        if: steps.deploy_try.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - id: deploy
        run: echo "page_url=${{ steps.deploy_try.outputs.page_url || steps.deploy_retry.outputs.page_url }}" >> "$GITHUB_OUTPUT"
